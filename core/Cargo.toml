[package]
name = "seu-labor-core"
version = "1.2.0"
edition = "2024"
description = "Portable core for the SEU labor course watcher"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cookie = "0.18"
percent-encoding = "2"
rand = "0.8"
regex = "1"
rsa = "0.9"
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", default-features = false, features = ["json"] }
url = "2"
jni = { version = "0.21", optional = true }

[features]
default = ["native-tls"]
native-tls = ["ureq/native-tls"]
rustls = ["ureq/tls"]
android-ffi = ["dep:jni"]
