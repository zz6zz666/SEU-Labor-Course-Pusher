appId: cn.edu.seu.laborpusher
productName: SEU劳动教育课程推送助手
copyright: MIT License

directories:
  output: release
  buildResources: assets

# 复用本地已解压的 Electron 运行时，避免打包时再下载一遍 110MB。
# （electron-builder 默认会去自己的缓存目录找，那是个独立于 node_modules 的缓存）
electronDist: node_modules/electron/dist

# asar 打包；config.example.json 必须带上，安装后首次启动会用它生成 config.json
files:
  - dist/**/*
  - assets/icon.ico
  - assets/icon.png
  - config.example.json
  - package.json

extraMetadata:
  main: dist/main/index.js

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SEU劳动教育课程推送助手
  runAfterFinish: true
  deleteAppDataOnUninstall: false
