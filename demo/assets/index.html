<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<style>
:root{
  --h:265; --s:82%; --l:64%;
  --accent:hsl(var(--h) var(--s) var(--l));
  --accent-soft:hsl(var(--h) var(--s) var(--l) / .16);
  --bg:#070912;
  --panel:rgba(255,255,255,.045);
  --panel-2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.18);
  --text:#eef1ff;
  --muted:#8d98be;
  --good:#5ad1a0;
  --bad:#ff6b81;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Microsoft YaHei UI",sans-serif;
  color:var(--text); background:var(--bg); overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
body::before{
  content:""; position:fixed; inset:-35%; z-index:0; pointer-events:none;
  background:
    radial-gradient(closest-side, hsl(var(--h) 88% 56% / .55), transparent 70%) 16% 10%/58% 58% no-repeat,
    radial-gradient(closest-side, hsl(calc(var(--h) + 95) 85% 55% / .42), transparent 70%) 84% 26%/54% 54% no-repeat,
    radial-gradient(closest-side, hsl(calc(var(--h) + 205) 82% 55% / .34), transparent 70%) 48% 96%/66% 66% no-repeat;
  filter:blur(64px) saturate(1.12); opacity:.6;
  transition:background .5s linear;
  animation:drift 28s ease-in-out infinite alternate;
}
@keyframes drift{
  0%{transform:translate3d(-3%,-2%,0) rotate(0) scale(1)}
  100%{transform:translate3d(4%,3%,0) rotate(10deg) scale(1.12)}
}
#app{position:relative; z-index:1; height:100%; padding:20px; display:flex; flex-direction:column; gap:14px; overflow:auto}
.view{gap:14px}

/* top bar */
.top{display:flex; align-items:center; justify-content:space-between; gap:16px}
.brand{display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:.2px; font-size:15px}
.brand .logo{width:26px;height:26px;color:var(--accent);display:inline-flex}
.brand .logo svg{width:100%;height:100%}
.top-right{display:flex; align-items:center; gap:8px}
.pill{font-size:12px; color:var(--muted); background:var(--panel); border:1px solid var(--line); padding:5px 10px; border-radius:999px}
.clock{font-variant-numeric:tabular-nums; font-size:13px; color:var(--text); background:var(--accent-soft); border:1px solid var(--line-2); padding:5px 10px; border-radius:999px}

/* cards + panels */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
.panel{padding:16px}
.panel-h{display:flex; align-items:baseline; gap:10px; font-weight:650; font-size:14px; margin-bottom:12px}
.panel-h .sub{font-weight:400; font-size:12px; color:var(--muted)}

/* mission grid */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mission{display:flex; align-items:center; gap:12px; padding:14px; transition:transform .15s ease, border-color .2s ease, background .2s ease}
.mission:hover{transform:translateY(-2px)}
.mission.open{border-color:color-mix(in srgb, var(--accent) 55%, transparent); background:var(--accent-soft)}
.m-icon{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);border:1px solid var(--line-2)}
.m-icon svg{width:22px;height:22px}
.m-body{flex:1; min-width:0}
.m-name{font-weight:600; font-size:14px}
.m-blurb{font-size:12px; color:var(--muted); margin-top:2px}
.m-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.status{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 8px}
.status.on{color:var(--good); border-color:color-mix(in srgb, var(--good) 45%, transparent); background:color-mix(in srgb, var(--good) 14%, transparent)}

/* buttons */
.btn{font:inherit; font-size:13px; font-weight:600; color:#fff; background:var(--accent); border:1px solid transparent; border-radius:10px; padding:8px 14px; cursor:pointer; transition:filter .15s ease, transform .1s ease, background .2s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--panel-2); border-color:var(--line-2); color:var(--text)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn.danger{background:color-mix(in srgb, var(--bad) 88%, #000); }
.btn.small{padding:6px 10px; font-size:12px; font-weight:500}

/* theme sliders */
.theme-panel{display:flex; gap:18px; align-items:flex-end}
.grow{flex:1; min-width:0}
.sliders{display:flex; flex-direction:column; gap:8px}
.slider-row{display:flex; align-items:center; gap:10px}
.slider-l{width:34px; font-size:12px; color:var(--muted)}
.range{-webkit-appearance:none; appearance:none; height:6px; border-radius:999px; flex:1;
  background:linear-gradient(90deg, hsl(0 90% 60%), hsl(60 90% 60%), hsl(120 90% 55%), hsl(180 90% 55%), hsl(240 90% 62%), hsl(300 90% 62%), hsl(360 90% 60%));
  outline:none}
.slider-row:nth-child(2) .range, .slider-row:nth-child(3) .range{background:linear-gradient(90deg,#3a3f52,#eef1ff)}
.range::-webkit-slider-thumb{-webkit-appearance:none; width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.4)}
.actions{display:flex; flex-direction:column; gap:8px}
.actions .btn{white-space:nowrap}

/* event log */
.log{display:flex; flex-direction:column; gap:4px; max-height:150px; overflow:auto}
.log-row{display:flex; gap:10px; font-size:12.5px; padding:3px 2px; border-bottom:1px dashed rgba(255,255,255,.05)}
.log-t{color:var(--muted); font-variant-numeric:tabular-nums; flex:none}
.log-x{color:var(--text)}

/* timer view */
.timer-view{align-items:center}
.dial{position:relative; width:280px;height:280px;margin:6px auto}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none; stroke:rgba(255,255,255,.08); stroke-width:14}
.ring-fill{fill:none; stroke:var(--accent); stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset .25s linear, stroke .4s ease}
.dial-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.t-time{font-size:52px; font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums}
.t-phase{font-size:13px; color:var(--muted); margin-top:4px}
body.focusing .t-time{color:var(--accent); text-shadow:0 0 24px var(--accent-soft)}
.chips{display:flex; gap:8px; justify-content:center}
.chip{font:inherit; font-size:12.5px; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer}
.chip.on{color:#fff; background:var(--accent-soft); border-color:var(--line-2)}
.controls{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.hint{font-size:12px; color:var(--muted); text-align:center; max-width:420px; margin:2px auto 0}

/* lab view */
.lab-preview{height:190px; border-radius:var(--radius); border:1px solid var(--line-2); box-shadow:inset 0 0 60px rgba(0,0,0,.25); transition:background .35s ease}
.lab-readout{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; margin:10px 0}
.swatches{display:flex; gap:10px; margin-bottom:6px}
.swatch{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-2);cursor:pointer; transition:transform .12s ease}
.swatch:hover{transform:translateY(-2px) scale(1.05)}

/* bubbles view */
.bubbles-view{position:relative}
.bubbles-view .canvas{position:absolute; inset:0; z-index:-1; display:block}
.bubble-hint{position:absolute; left:0; right:0; bottom:16px; text-align:center; font-size:12px; color:var(--muted)}

/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:999px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const TITLE='Orbit';
  const MISSIONS=[
    {id:'hub',     name:'控制台',   blurb:'总览与调度',        icon:'hub'},
    {id:'timer',   name:'专注计时', blurb:'番茄钟，全窗口同步', icon:'timer'},
    {id:'lab',     name:'调色实验室',blurb:'换个色相，整屋换肤', icon:'lab'},
    {id:'bubbles', name:'星尘',     blurb:'点一点，冒个泡',    icon:'bubbles'}
  ];
  const ICONS={
    hub:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><ellipse cx="12" cy="12" rx="9.2" ry="4.2" transform="rotate(-24 12 12)"/><circle cx="20" cy="8.2" r="1.4" fill="currentColor" stroke="none"/></svg>',
    timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="13.5" r="7.8"/><path d="M12 13.5V9"/><path d="M9 4h6"/><path d="M12 4v1.8"/></svg>',
    lab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c3 4 6 6.6 6 10a6 6 0 0 1-12 0c0-3.4 3-6 6-10z"/><path d="M9.5 13.5c1.4 1 3.6 1 5 0"/></svg>',
    bubbles:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="10" r="4.2"/><circle cx="16.5" cy="15.5" r="3"/><circle cx="15.2" cy="6.8" r="2"/></svg>'
  };
  const TITLES={hub:'Orbit · 控制台',timer:'Orbit · 专注计时',lab:'Orbit · 调色实验室',bubbles:'Orbit · 星尘'};

  let STATE=null;
  let updateView=function(){};

  function el(tag,attrs){
    const n=document.createElement(tag);
    if(attrs) for(const k in attrs){
      const v=attrs[k];
      if(v===null||v===undefined) continue;
      if(k==='class') n.className=v;
      else if(k==='html') n.innerHTML=v;
      else if(k==='text') n.textContent=v;
      else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2).toLowerCase(),v);
      else n.setAttribute(k,v);
    }
    for(let i=2;i<arguments.length;i++){
      const c=arguments[i];
      (Array.isArray(c)?c:[c]).forEach(function(x){
        if(x===null||x===undefined) return;
        n.append(x.nodeType?x:document.createTextNode(String(x)));
      });
    }
    return n;
  }
  function range(min,max,val){ return el('input',{type:'range',min:min,max:max,value:val,class:'range'}); }
  function sliderRow(label,input){ return el('label',{class:'slider-row'},el('span',{class:'slider-l'},label),input); }
  function mmss(ms){ const s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function applyTheme(t){ const r=document.documentElement.style; r.setProperty('--h',t.h); r.setProperty('--s',t.s+'%'); r.setProperty('--l',t.l+'%'); }
  function onState(s){ STATE=s; applyTheme(s.theme); updateView(s); }

  /* ---------------------------------------------------------------- hub */
  function buildHub(root){
    root.className='view hub';
    const clock=el('span',{class:'clock'},'--:--:--');
    const pillUp=el('span',{class:'pill'});
    const pillWin=el('span',{class:'pill'});
    const head=el('header',{class:'top'},
      el('div',{class:'brand'},el('span',{class:'logo',html:ICONS.hub}),el('span',null,TITLE+' 控制台')),
      el('div',{class:'top-right'},pillUp,pillWin,clock));

    const grid=el('div',{class:'grid'});
    const refs={};
    MISSIONS.forEach(function(m){
      const status=el('span',{class:'status'},'未运行');
      const btn=el('button',{class:'btn'});
      const card=el('div',{class:'card mission'},
        el('div',{class:'m-icon',html:ICONS[m.icon]}),
        el('div',{class:'m-body'},el('div',{class:'m-name'},m.name),el('div',{class:'m-blurb'},m.blurb)),
        el('div',{class:'m-side'},status,btn));
      btn.addEventListener('click',function(){
        const open=STATE&&STATE.windows.indexOf(m.id)>=0;
        const p=open?orbit.stop({id:m.id}):orbit.start({id:m.id});
        p.then(onState).catch(function(){});
      });
      refs[m.id]={status:status,btn:btn,card:card};
      grid.appendChild(card);
    });

    const hue=range(0,360,STATE?STATE.theme.h:265);
    const sat=range(40,100,STATE?STATE.theme.s:82);
    const lig=range(40,80,STATE?STATE.theme.l:64);
    let last=0;
    function pushTheme(){
      const now=Date.now(); if(now-last<70) return; last=now;
      orbit.setTheme({h:+hue.value,s:+sat.value,l:+lig.value}).then(onState).catch(function(){});
    }
    [hue,sat,lig].forEach(function(x){ x.addEventListener('input',pushTheme); });

    const rnd=el('button',{class:'btn ghost',onclick:function(){ orbit.randomTheme().then(onState).catch(function(){}); }},'随机主题');
    const stopAll=el('button',{class:'btn ghost',onclick:function(){ orbit.stopAll().then(onState).catch(function(){}); }},'关闭所有窗口');
    const quit=el('button',{class:'btn danger',onclick:function(){ orbit.quit(); }},'退出 '+TITLE);

    const log=el('div',{class:'log'});

    root.append(head,
      el('div',{class:'card panel'},
        el('div',{class:'panel-h'},'任务',el('span',{class:'sub'},'打开即运行，关闭即停止；托盘菜单就是这份任务列表')),
        grid),
      el('div',{class:'card panel theme-panel'},
        el('div',{class:'grow'},
          el('div',{class:'panel-h'},'主题色相',el('span',{class:'sub'},'拖动即让所有窗口即时换肤')),
          el('div',{class:'sliders'},sliderRow('H',hue),sliderRow('S',sat),sliderRow('L',lig))),
        el('div',{class:'actions'},rnd,stopAll,quit)),
      el('div',{class:'card panel'},
        el('div',{class:'panel-h'},'事件流',el('span',{class:'sub'},'所有窗口共享')),
        log));

    let lastLog='';
    return function(s){
      clock.textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});
      pillUp.textContent='已运行 '+mmss(s.uptimeMs);
      pillWin.textContent=s.windows.length+' / '+MISSIONS.length+' 窗口';
      MISSIONS.forEach(function(m){
        const open=s.windows.indexOf(m.id)>=0, r=refs[m.id];
        r.card.classList.toggle('open',open);
        r.status.textContent=open?'运行中':'未运行';
        r.status.classList.toggle('on',open);
        r.btn.textContent=open?'关闭':'打开';
        r.btn.classList.toggle('danger',open);
      });
      if(document.activeElement!==hue) hue.value=s.theme.h;
      if(document.activeElement!==sat) sat.value=s.theme.s;
      if(document.activeElement!==lig) lig.value=s.theme.l;
      const key=s.log.length+'|'+(s.log.length?s.log[s.log.length-1].t:'');
      if(key!==lastLog){
        lastLog=key; log.innerHTML='';
        for(let i=s.log.length-1;i>=0;i--){
          const e=s.log[i];
          log.appendChild(el('div',{class:'log-row'},
            el('span',{class:'log-t'},new Date(e.t).toLocaleTimeString('zh-CN',{hour12:false})),
            el('span',{class:'log-x'},e.text)));
        }
      }
    };
  }

  /* -------------------------------------------------------------- timer */
  function buildTimer(root){
    root.className='view timer-view';
    const R=112, C=2*Math.PI*R;
    const ring=document.createElementNS('http://www.w3.org/2000/svg','svg');
    ring.setAttribute('viewBox','0 0 260 260');
    ring.setAttribute('class','ring');
    ring.innerHTML='<circle class="ring-track" cx="130" cy="130" r="'+R+'"></circle>'+
      '<circle class="ring-fill" cx="130" cy="130" r="'+R+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"></circle>';
    const fill=ring.querySelector('.ring-fill');
    const time=el('div',{class:'t-time'},'25:00');
    const phase=el('div',{class:'t-phase'},'准备开始');
    const dial=el('div',{class:'dial'},ring,el('div',{class:'dial-center'},time,phase));

    let minutes=25;
    const chips=[25,15,5].map(function(min){
      const b=el('button',{class:'chip'+(min===25?' on':'')},min+' 分钟');
      b.addEventListener('click',function(){
        minutes=min;
        chips.forEach(function(c){c.classList.remove('on');});
        b.classList.add('on');
        orbit.timerReset().then(function(){ return orbit.timerStart({minutes:min}); }).then(onState).catch(function(){});
      });
      return b;
    });
    const startBtn=el('button',{class:'btn',onclick:function(){ orbit.timerStart({minutes:minutes}).then(onState).catch(function(){}); }},'开始');
    const pauseBtn=el('button',{class:'btn ghost',onclick:function(){ orbit.timerPause().then(onState).catch(function(){}); }},'暂停');
    const resetBtn=el('button',{class:'btn ghost',onclick:function(){ orbit.timerReset().then(onState).catch(function(){}); }},'重置');
    const closeBtn=el('button',{class:'btn ghost',onclick:function(){ orbit.stop({id:'timer'}).then(onState).catch(function(){}); }},'关闭本窗口');

    root.append(
      el('header',{class:'top'},
        el('div',{class:'brand'},el('span',{class:'logo',html:ICONS.timer}),el('span',null,'专注计时')),
        el('div',{class:'top-right'},el('button',{class:'btn ghost small',onclick:function(){orbit.openHub();}},'控制台'))),
      dial,
      el('div',{class:'chips'},chips),
      el('div',{class:'controls'},startBtn,pauseBtn,resetBtn,closeBtn),
      el('div',{class:'hint'},'计时由宿主保存，关闭本窗口再打开也会接着走。'));

    return function(s){
      const t=s.timer;
      let remaining=t.running?(t.endsAt-Date.now()):(t.pausedRemaining!==null&&t.pausedRemaining!==undefined?t.pausedRemaining:t.durationMs);
      remaining=Math.max(0,remaining);
      time.textContent=mmss(remaining);
      const frac=t.durationMs>0?Math.min(1,remaining/t.durationMs):0;
      fill.style.strokeDashoffset=String(C*(1-frac));
      phase.textContent=t.running?'专注中…':(remaining<t.durationMs-500?'已暂停':'准备开始');
      document.body.classList.toggle('focusing',t.running);
      startBtn.style.display=t.running?'none':'';
      pauseBtn.style.display=t.running?'':'none';
    };
  }

  /* ---------------------------------------------------------------- lab */
  function buildLab(root){
    root.className='view lab-view';
    const preview=el('div',{class:'lab-preview'});
    const readout=el('div',{class:'lab-readout'});
    const hue=range(0,360,STATE?STATE.theme.h:265), sat=range(40,100,STATE?STATE.theme.s:82), lig=range(40,80,STATE?STATE.theme.l:64);
    let last=0;
    function push(){
      const now=Date.now(); if(now-last<70) return; last=now;
      orbit.setTheme({h:+hue.value,s:+sat.value,l:+lig.value}).then(onState).catch(function(){});
    }
    [hue,sat,lig].forEach(function(x){ x.addEventListener('input',push); });
    const presets=[[265,82,64],[190,85,60],[330,78,62],[24,90,60],[152,68,52],[52,95,60]];
    const swatches=el('div',{class:'swatches'},presets.map(function(p){
      const b=el('button',{class:'swatch'});
      b.style.background='linear-gradient(135deg, hsl('+p[0]+' '+p[1]+'% '+p[2]+'%), hsl('+((p[0]+60)%360)+' '+p[1]+'% '+Math.min(82,p[2]+8)+'%))';
      b.addEventListener('click',function(){ orbit.setTheme({h:p[0],s:p[1],l:p[2]}).then(onState).catch(function(){}); });
      return b;
    }));
    const closeBtn=el('button',{class:'btn ghost',onclick:function(){ orbit.stop({id:'lab'}).then(onState).catch(function(){}); }},'关闭本窗口');
    root.append(
      el('header',{class:'top'},
        el('div',{class:'brand'},el('span',{class:'logo',html:ICONS.lab}),el('span',null,'调色实验室')),
        el('div',{class:'top-right'},el('button',{class:'btn ghost small',onclick:function(){orbit.openHub();}},'控制台'))),
      preview,
      el('div',{class:'card panel'},
        el('div',{class:'panel-h'},'色相 / 饱和 / 亮度',el('span',{class:'sub'},'改一处，全屋一起变')),
        el('div',{class:'sliders'},sliderRow('H',hue),sliderRow('S',sat),sliderRow('L',lig)),
        el('div',{class:'panel-h'},'预设'),
        swatches,readout,closeBtn));
    return function(s){
      const t=s.theme;
      preview.style.background='linear-gradient(135deg, hsl('+t.h+' '+t.s+'% '+t.l+'%), hsl('+((t.h+64)%360)+' '+t.s+'% '+Math.min(84,t.l+8)+'%))';
      readout.textContent='hsl('+t.h+' '+t.s+'% '+t.l+'%)';
      if(document.activeElement!==hue) hue.value=t.h;
      if(document.activeElement!==sat) sat.value=t.s;
      if(document.activeElement!==lig) lig.value=t.l;
    };
  }

  /* ------------------------------------------------------------ bubbles */
  function buildBubbles(root){
    root.className='view bubbles-view';
    const canvas=el('canvas',{class:'canvas'});
    const hint=el('div',{class:'bubble-hint'},'点击气泡，让整个房间听到');
    root.append(
      el('header',{class:'top'},
        el('div',{class:'brand'},el('span',{class:'logo',html:ICONS.bubbles}),el('span',null,'星尘')),
        el('div',{class:'top-right'},el('button',{class:'btn ghost small',onclick:function(){orbit.openHub();}},'控制台'))),
      canvas,hint);
    const ctx=canvas.getContext('2d');
    const dpr=Math.min(2,window.devicePixelRatio||1);
    let W=0,H=0;
    function resize(){ W=window.innerWidth; H=window.innerHeight; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    window.addEventListener('resize',resize); resize();
    let theme={h:265,s:82,l:64};
    const bubbles=[];
    function spawn(){
      bubbles.push({x:Math.random()*W,y:H+40,r:8+Math.random()*34,vy:-(0.25+Math.random()*0.8),vx:(Math.random()-0.5)*0.35,ph:Math.random()*6.28});
    }
    for(let i=0;i<26;i++){ spawn(); bubbles[i].y=Math.random()*H; }
    canvas.addEventListener('pointerdown',function(e){
      for(let i=bubbles.length-1;i>=0;i--){
        const b=bubbles[i];
        if(Math.hypot(b.x-e.clientX,b.y-e.clientY)<b.r+6){
          bubbles.splice(i,1); spawn();
          orbit.say({text:'噗—— 戳破了一个气泡'}).then(onState).catch(function(){});
          break;
        }
      }
    });
    (function frame(){
      ctx.clearRect(0,0,W,H);
      for(let i=bubbles.length-1;i>=0;i--){
        const b=bubbles[i]; b.ph+=0.02; b.x+=b.vx+Math.sin(b.ph)*0.35; b.y+=b.vy;
        if(b.y<-60){ bubbles.splice(i,1); spawn(); continue; }
        const g=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.1,b.x,b.y,b.r);
        g.addColorStop(0,'hsla('+theme.h+' '+theme.s+'% '+Math.min(88,theme.l+22)+'% / .55)');
        g.addColorStop(1,'hsla('+((theme.h+50)%360)+' '+theme.s+'% '+theme.l+'% / .10)');
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fillStyle=g; ctx.fill();
        ctx.strokeStyle='hsla('+theme.h+' '+theme.s+'% '+Math.min(90,theme.l+20)+'% / .5)'; ctx.lineWidth=1; ctx.stroke();
      }
      requestAnimationFrame(frame);
    })();
    return function(s){
      theme=s.theme;
      hint.textContent=s.windows.length>1
        ? '与另外 '+(s.windows.length-1)+' 个窗口共享同一个主题'
        : '点击气泡，让整个房间听到';
    };
  }

  /* --------------------------------------------------------------- boot */
  const view=(location.hash.replace('#','')||'hub');
  const root=document.getElementById('app');
  if(view==='timer') updateView=buildTimer(root);
  else if(view==='lab') updateView=buildLab(root);
  else if(view==='bubbles') updateView=buildBubbles(root);
  else updateView=buildHub(root);
  document.title=TITLES[view]||TITLE;

  orbit.on('state',onState);
  orbit.state().then(onState).catch(function(){});
  setInterval(function(){ if(STATE) updateView(STATE); },250);
})();
</script>
</body>
