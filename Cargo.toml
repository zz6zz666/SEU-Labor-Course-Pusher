[package]
name = "seu-labor"
version = "1.2.0"
edition = "2024"
description = "SEU 劳动教育课程推送助手"
license = "MIT"
repository = "https://github.com/zz6zz666/SEU-Labor-Course-Pusher"

[workspace]
members = ["crates/traykit", "crates/browserhost", "crates/webmsg", "crates/websurface", "crates/winkit"]
default-members = ["."]
resolver = "3"

# Shared metadata + dependency versions for the reusable crates, so they cannot
# drift apart. The root application keeps its own version (1.2.0) above.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zz6zz666/SEU-Labor-Course-Pusher"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.61"

[[bin]]
name = "seu-labor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
browserhost = { path = "crates/browserhost" }
traykit = { path = "crates/traykit" }
webmsg = { path = "crates/webmsg" }
websurface = { path = "crates/websurface" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cookie = "0.18"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
scraper = "0.20"
url = "2"
percent-encoding = "2"
base64 = "0.22"
rand = "0.8"
rsa = "0.9"
ureq = { version = "2.10", default-features = false, features = ["native-tls", "json"] }
tauri-winrt-notification = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
