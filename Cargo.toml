[package]
name = "seu-labor"
version = "1.2.0"
edition = "2024"
description = "SEU 劳动教育课程推送助手"
license = "MIT"
repository = "https://github.com/zz6zz666/SEU-Labor-Course-Pusher"

[[bin]]
name = "seu-labor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Reusable Windows/web-UI building blocks live in the sibling `rust-webui-kit`.
browserhost = { path = "../rust-webui-kit/crates/browserhost" }
traykit = { path = "../rust-webui-kit/crates/traykit" }
webmsg = { path = "../rust-webui-kit/crates/webmsg" }
websurface = { path = "../rust-webui-kit/crates/websurface" }
winkit = { path = "../rust-webui-kit/crates/winkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cookie = "0.18"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
scraper = "0.20"
url = "2"
percent-encoding = "2"
base64 = "0.22"
rand = "0.8"
rsa = "0.9"
ureq = { version = "2.10", default-features = false, features = ["native-tls", "json"] }
tauri-winrt-notification = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
