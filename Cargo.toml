[workspace]
members = ["core"]
resolver = "3"

[package]
name = "seu-labor"
version = "1.2.0"
edition = "2024"
description = "SEU 劳动教育课程推送助手"
license = "MIT"
repository = "https://github.com/zz6zz666/SEU-Labor-Course-Pusher"

[[bin]]
name = "seu-labor"
path = "src/main.rs"

[build-dependencies]
winres-embed = { path = "../rust-webui-kit/crates/winres-embed" }

[dependencies]
anyhow = "1"
# Reusable Windows/web-UI building blocks live in the sibling `rust-webui-kit`.
browserhost = { path = "../rust-webui-kit/crates/browserhost" }
traykit = { path = "../rust-webui-kit/crates/traykit" }
webmsg = { path = "../rust-webui-kit/crates/webmsg" }
websurface = { path = "../rust-webui-kit/crates/websurface" }
winkit = { path = "../rust-webui-kit/crates/winkit" }
seu-labor-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-winrt-notification = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Android keeps unwinding so a panic in the JNI bridge can be caught instead of
# taking the whole app process down.
[profile.android_release]
inherits = "release"
panic = "unwind"
