name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The reusable Windows/web-UI crates live in a sibling repository that this
      # one depends on by relative path, so fetch it next to this checkout.
      # Requires that repository to be reachable (push it before relying on CI).
      - uses: actions/checkout@v4
        with:
          repository: zz6zz666/rust-webui-kit
          path: ../rust-webui-kit

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check (must be warning-free)
        run: cargo check --all-targets --message-format short

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release
