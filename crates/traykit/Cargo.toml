[package]
name = "traykit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Resident tray icon with a custom-drawn Fluent-style popup menu"
keywords = ["windows", "tray", "system-tray", "win32", "menu"]
categories = ["gui"]

[dependencies]
anyhow.workspace = true
winkit = { path = "../winkit" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }
