[package]
name = "browserhost"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Locate, launch and drive an installed Chromium-family browser over CDP"
keywords = ["chromium", "cdp", "browser", "automation", "webview"]
categories = ["development-tools"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
ureq = { version = "2.10", default-features = false, features = ["native-tls", "json"] }
tungstenite = { version = "0.24", default-features = false, features = ["native-tls", "handshake"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
